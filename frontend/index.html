<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Connexion</h1>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Entrez votre email"
                    required
                >
            </div>

            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Entrez votre mot de passe"
                    required
                >

            </div>

            <button type="submit">
                Se connecter
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script src="app.js"></script>

</body>

</html>
